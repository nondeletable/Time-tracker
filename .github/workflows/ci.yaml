name: CI

on:
  # Every pull request, whatever it targets. Filtering on `main` here would leave
  # a pull request that is stacked on another branch - the work is split that way
  # while a review is pending - with no checks at all until it is retargeted.
  pull_request:
  push:
    branches: [main]
  # A dependency turns vulnerable without us pushing anything, so the audit job
  # also runs on a timer. Mondays 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Cancel superseded runs on PRs only. On main a cancelled run would erase the
# record of which commit is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: lint + test
    runs-on: ubuntu-latest
    # The weekly cron exists for `audit` only — no point rechecking unchanged code.
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (JavaScript)
        run: npm run lint

      # Reports the CSS backlog on every PR without gating on it. The stylesheet
      # carries 62 known violations, 19 of them no-descending-specificity, and
      # clearing those means reordering the cascade — a change that needs to be
      # looked at, not merged on a green tick. Flip this to a gate once the CSS
      # pass of the code audit has cleared them.
      - name: Lint (CSS, reporting only)
        run: npm run lint:css
        continue-on-error: true

      - name: Test
        run: npm test

  # The real app, started by npm run smoke: onboarding, Focus and the five views
  # with no page errors, plus idle effects staying off under reduced motion.
  # Windows, because that is the platform the app ships for, and a Windows
  # runner has a desktop to open the window on without an xvfb wrapper. The
  # Electron binary downloads itself on first use since Electron 42.
  smoke:
    name: smoke (Electron)
    runs-on: windows-latest
    if: github.event_name != 'schedule'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke
        run: npm run smoke

  # Neither half needs a build or the Electron binary, and on the weekly cron
  # this is the only job that runs.
  audit:
    name: audit (dependencies + secrets)
    runs-on: ubuntu-latest

    # On a pull_request event gitleaks asks the API which commits belong to the
    # PR before scanning, which needs pull-requests: read. A job-level block
    # replaces the workflow-level set rather than extending it, so both are
    # restated here. Still read-only.
    permissions:
      contents: read
      pull-requests: read

    steps:
      # fetch-depth: 0 — gitleaks scans the whole history, not just the tip.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to a commit SHA rather than a tag: a tag on a third-party action
      # can be moved to point at new code, which is the supply-chain hole this
      # job exists to catch.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings land in the job summary and the log. The artifact would be a
          # file containing the very secrets we found, and PR comments would need
          # write permissions this workflow deliberately does not have.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Reads package-lock.json directly — no `npm ci` needed.
      # Threshold `high`: `low` is dominated by dev-only noise we cannot act on.
      #
      # Reporting only for now. Electron itself left the report with the upgrade
      # to 44; the 11 advisories still at this threshold all sit under
      # electron-builder 24 and only run at build time, never in the shipped
      # app. Flip this to a gate once electron-builder is upgraded too.
      - name: npm audit (reporting only)
        run: npm audit --audit-level=high
        continue-on-error: true
